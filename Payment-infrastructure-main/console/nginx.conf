server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # The engine. Same origin as the console, so there is no CORS preflight and no second
  # certificate to manage.
  location /v1/ {
    proxy_pass http://nazar:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  # Server-sent events. Buffering here would hold decisions back until the buffer filled,
  # which on a live feed reads as "the system stopped working".
  location /v1/stream {
    proxy_pass http://nazar:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 24h;
  }

  # HashRouter serves everything from index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
