  requires_keys: ["w:{b:<acct>}:payers"]
  provenance: B
  monotone: increasing
  guard: "fanin_24h >= 6"
  rails: [UPI, IMPS, NEFT]
  catches: [mule_fanout]

- id: pair_txn_count_90d
  version: 1
  description: "pr:{r}.txn_count_90d"
  requires_keys: ["pr:{r:<payer>:<payee>}"]
  provenance: C
  monotone: decreasing
  rails: [UPI, IMPS, NEFT, CARD_CNP, CARD_CP]
  catches: [app_scam]

- id: pair_amt_ratio_p95
  version: 1
  description: "amt / pr.amt_p95_minor, guarded (docs/02 §5.2)"
  requires_keys: ["pr:{r:<payer>:<payee>}"]
  provenance: B
  monotone: increasing
  guard: "pair.amt_p95 > 0 and pair.txn_count >= 3"
  rails: [UPI, IMPS, NEFT]
  catches: [app_scam]

- id: payee_fwd_latency_p50_s
  version: 1
  description: "fwd:{b}.fwd_latency_p50_s, guarded on sample_n>=3 and freshness (docs/02 §5.4)"
  requires_keys: ["fwd:{b:<acct>}"]
  provenance: B
  monotone: decreasing
  guard: "fwd_sample_n >= 3 and not stale(15m)"
  rails: [UPI, IMPS, NEFT]
  catches: [mule_fanout]

- id: payee_fwd_ratio_1h
  version: 1
  description: "sum(out)/sum(in) minute buckets, guarded (docs/02 §5.4)"
  requires_keys: ["c:{b:<acct>}:in:m", "c:{b:<acct>}:out:m"]
  provenance: B
  monotone: increasing
  guard: "inflow >= 100 minor and fwd_sample_n >= 3"
  rails: [UPI, IMPS, NEFT]
  catches: [mule_fanout]

- id: payee_inflow_concentration
  version: 1
