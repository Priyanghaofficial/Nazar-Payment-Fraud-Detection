- id: payee_is_new_to_payer
  version: 1
  description: "NOT SISMEMBER s:{p}:payees"
  requires_keys: ["s:{p:<acct>}:payees"]
  provenance: B
  monotone: increasing
  rails: [UPI, IMPS, NEFT]
  catches: [app_scam, mule_fanout]

- id: payee_first_seen_by_us_days
  version: 1
  description: "(now - f:{b}.first_seen) / 86400000. Named honestly (D8) — NOT account age."
  requires_keys: ["f:{b:<acct>}:first_seen"]
  provenance: B
  monotone: decreasing
  rails: [UPI, IMPS, NEFT]
  catches: [app_scam, mule_fanout]

