# features/registry.yaml — one entry per feature. Machine-read by the Go scorer
# (go/internal/features/registry.go), the Python trainer (py/training), and
# test_feature_catalogue_key_coverage. Declared as data, not as code (docs/00 §3.2, §9;
# docs/02 §4). Adding, removing, or changing a feature here is a Type 2 decision.
#
# provenance: A = attacker-controlled, B = attacker-shapeable, C = bank-observed (docs/02 §2)
# monotone:  increasing | decreasing | "" (no LightGBM constraint)

- id: amt_robust_z
  version: 1
  description: "0.6745*(amt-median)/mad_eff, guarded (docs/02 §5.1)"
  requires_keys: ["b:{p:<acct>}"]
  provenance: A
  cost_to_forge: "trivial — the attacker picks the amount"
  monotone: increasing
  rails: [UPI, IMPS, NEFT, CARD_CNP, CARD_CP]
  catches: [amount_outlier]

- id: amt_over_p95
  version: 1
  description: "amt / p95, clipped to 20"
  requires_keys: ["b:{p:<acct>}"]
  provenance: A
  cost_to_forge: "trivial"
  monotone: increasing
  rails: [UPI, IMPS, NEFT, CARD_CNP, CARD_CP]
  catches: [amount_outlier]

- id: hour_surprisal
  version: 1
  description: "-log2(P(hour)), Laplace-smoothed over the payer's own hour histogram"
  requires_keys: ["h:{p:<acct>}:hourhist"]
  provenance: A
  cost_to_forge: "trivial — attacker picks the time"
  monotone: increasing
  rails: [UPI, IMPS, NEFT, CARD_CNP, CARD_CP]
  catches: [ato, off_hours_fraud]

- id: txn_velocity_1m
  version: 1
  description: "ZCOUNT payer txn window, 1 minute"
  requires_keys: ["w:{p:<acct>}:txn"]
  provenance: A
  monotone: increasing
  rails: [UPI, IMPS, NEFT, CARD_CNP, CARD_CP]
  catches: [extreme_velocity]

- id: txn_velocity_5m
